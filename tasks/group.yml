# WIP This needs lots more work!
#
# This file should:
#
# 1. Get a list of all groups for users present and ensure they all exist
# 2. Get a list of all users_group_members for users present and ensure that these user accounts exist
# 3. Loop though the users present to ensure that are in the right groups and not others
# 4. Loop through the users_group_members and ensure they have the right members

- name: User groups configured
  block:

    - name: User groups
      block:

        - name: "Debug users_groups for {{ user.key }}"
          ansible.builtin.debug:
            var: user.value.users_groups
            verbosity: 2
          tags:
            - debug

        - name: "Groups present for {{ user.key }}"
          ansible.builtin.group:
            name: "{{ users_grp }}"
            state: present
          loop: "{{ user.value.users_groups }}"
          loop_control:
            loop_var: users_grp
            label: "{{ users_grp }}"

      when:
        - user.value.users_groups is defined
        - user.value.users_groups != []

    - name: "Debug users_group for {{ user.key }}"
      ansible.builtin.debug:
        var: users_grp
        verbosity: 2
      vars:
        users_grp: "{{ user.value.users_group | default(user.key) }}"
      tags:
        - debug

    - name: "User group present for {{ user.key }}"
      ansible.builtin.group:
        name: "{{ user.value.users_group | default(user.key) }}"
        state: present

    - name: Users group members present
      block:

        - name: "Debug users_group_members for {{ user.key }}"
          ansible.builtin.debug:
            var: users_grp
            verbosity: 2
          vars:
            users_grp: "{{ user.value.users_group | default(user.key) }}"
          tags:
            - debug

        - name: "Users group members present for {{ user.key }}"
          ansible.builtin.include_tasks: group_members.yml

      when:
        - user.value.users_group_members is defined
        - user.value.users_group_members != []

  tags:
    - users
...
